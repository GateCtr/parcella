kind = "web"
previewPath = "/"
title = "Registre parcellaire de Kinshasa"
description = "Registre sécurisé de prospection parcellaire pour les 24 communes de Kinshasa, avec formulaire multi-étapes, supervision, génération de plaques et espace imprimerie."
version = "1.0.0"
id = "artifacts/registre-parcellaire"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20181

[services.development]
run = "pnpm --filter @workspace/registre-parcellaire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/registre-parcellaire", "run", "build" ]
serve = "static"
publicDir = "artifacts/registre-parcellaire/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20181"
BASE_PATH = "/"
