openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API du registre parcellaire de Kinshasa
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: communes
  - name: fiches
  - name: dashboard
  - name: plaques
  - name: settings
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Utilisateur connecté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentification requise
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session créée; cookie HttpOnly défini
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Identifiants invalides
        "429":
          description: Trop de tentatives
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Session révoquée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Comptes utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "401":
          description: Authentification requise
        "403":
          description: Accès réservé aux administrateurs
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Compte créé; code d'accès affiché une seule fois
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          description: Données invalides
        "409":
          description: Adresse déjà utilisée
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Compte mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "404":
          description: Utilisateur introuvable
  /users/{id}/rotate-code:
    post:
      operationId: rotateUserCode
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Nouveau code affiché une seule fois
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCode"
        "404":
          description: Utilisateur introuvable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /communes:
    get:
      operationId: listCommunes
      tags: [communes]
      responses:
        "200":
          description: Les 24 communes de Kinshasa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commune"
  /public/plaques:
    get:
      operationId: getPublicPlaque
      tags: [plaques]
      description: Informations limitées sur une plaque, accessibles sans connexion via son QR.
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: Plaque reconnue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlaque"
        "404":
          description: Plaque non reconnue ou fiche non validée
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      parameters:
        - in: query
          name: commune
          schema: { type: string }
      responses:
        "200":
          description: Statistiques du registre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /fiches:
    get:
      operationId: listFiches
      tags: [fiches]
      parameters:
        - in: query
          name: commune
          schema: { type: string }
        - in: query
          name: statut
          schema: { type: string }
        - in: query
          name: recherche
          schema: { type: string }
      responses:
        "200":
          description: Liste filtrée des fiches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fiche"
    post:
      operationId: createFiche
      tags: [fiches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FicheInput"
      responses:
        "201":
          description: Fiche créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
        "409":
          description: Doublon détecté
  /fiches/check-duplicate:
    get:
      operationId: checkFicheDuplicate
      tags: [fiches]
      parameters:
        - in: query
          name: commune
          required: true
          schema: { type: string }
        - in: query
          name: quartier
          required: true
          schema: { type: string }
        - in: query
          name: avenue
          required: true
          schema: { type: string }
        - in: query
          name: parcelleNo
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Résultat du contrôle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateCheck"
  /fiches/{id}:
    get:
      operationId: getFiche
      tags: [fiches]
      parameters:
        - $ref: "#/components/parameters/FicheId"
      responses:
        "200":
          description: Détail de la fiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
        "404":
          description: Introuvable
    patch:
      operationId: updateFiche
      tags: [fiches]
      parameters:
        - $ref: "#/components/parameters/FicheId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FicheUpdate"
      responses:
        "200":
          description: Fiche mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
  /fiches/{id}/localite:
    patch:
      operationId: updateFicheLocalite
      tags: [fiches]
      parameters:
        - $ref: "#/components/parameters/FicheId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FicheLocaliteInput"
      responses:
        "200":
          description: Localité mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
  /fiches/{id}/decision:
    post:
      operationId: decideFiche
      tags: [fiches]
      parameters:
        - $ref: "#/components/parameters/FicheId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FicheDecision"
      responses:
        "200":
          description: Décision enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
  /fiches/{id}/plaque:
    post:
      operationId: generatePlaque
      tags: [plaques]
      parameters:
        - $ref: "#/components/parameters/FicheId"
      responses:
        "201":
          description: Plaque générée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plaque"
        "409":
          description: Fiche non validée ou plaque déjà générée
  /plaques:
    get:
      operationId: listPlaques
      tags: [plaques]
      parameters:
        - in: query
          name: commune
          schema: { type: string }
        - in: query
          name: statut
          schema: { type: string }
        - in: query
          name: ficheId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File d'impression
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plaque"
  /plaques/{id}/imprimer:
    post:
      operationId: markPlaquePrinted
      tags: [plaques]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Plaque marquée imprimée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plaque"
  /settings/rubriques:
    get:
      operationId: getRubriqueSettings
      tags: [settings]
      responses:
        "200":
          description: Configuration globale des rubriques
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubriqueSettings"
    patch:
      operationId: updateRubriqueSetting
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubriqueSettingChange"
      responses:
        "200":
          description: Configuration globale mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubriqueSettings"
components:
  parameters:
    UserId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    FicheId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    UserRole:
      type: string
      enum: [admin_principal, validateur, agent]
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
    ManagedUser:
      type: object
      required: [id, email, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    LoginInput:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, minLength: 20, maxLength: 256 }
    UserInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/UserRole" }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
    CreatedUser:
      type: object
      required: [user, accessCode]
      properties:
        user: { $ref: "#/components/schemas/ManagedUser" }
        accessCode: { type: string }
    AccessCode:
      type: object
      required: [accessCode]
      properties:
        accessCode: { type: string }
    LogoutResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Commune:
      type: object
      required: [code, nom]
      properties:
        code: { type: string }
        nom: { type: string }
    Fiche:
      type: object
      required: [id, ficheNo, commune, quartier, localite, avenue, parcelleNo, proprietaireNom, telephone, typeOccupation, usageParcelle, statutFiche, statutPlaque, dateProspection, createdAt]
      properties:
        id: { type: string, format: uuid }
        ficheNo: { type: string }
        commune: { type: string }
        quartier: { type: string }
        localite: { type: ["string", "null"] }
        avenue: { type: string }
        parcelleNo: { type: string }
        plaqueNo: { type: ["string", "null"] }
        proprietaireNom: { type: string }
        telephone: { type: string }
        typeOccupation: { type: string }
        superficie: { type: ["number", "null"] }
        usageParcelle: { type: string }
        plaqueExistante: { type: ["string", "null"] }
        statutPaiement: { type: ["string", "null"] }
        recuNo: { type: ["string", "null"] }
        sensibilisation: { type: ["string", "null"] }
        hygiene: { type: object, additionalProperties: true }
        dechets: { type: object, additionalProperties: true }
        facade: { type: object, additionalProperties: true }
        drainage: { type: object, additionalProperties: true }
        activites:
          type: array
          items: { type: string }
        remarques: { type: ["string", "null"] }
        avis: { type: object, additionalProperties: true }
        agentMatricule: { type: ["string", "null"] }
        chefRueNom: { type: ["string", "null"] }
        chefRueAvenue: { type: ["string", "null"] }
        statutFiche: { type: string, enum: [brouillon, soumise, validee, rejetee] }
        statutPlaque: { type: string, enum: [non_generee, generee, a_reimprimer, imprimee] }
        dateProspection: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    FicheInput:
      type: object
      required: [commune, quartier, avenue, parcelleNo, proprietaireNom, telephone, typeOccupation, usageParcelle, dateProspection]
      properties:
        commune: { type: string, minLength: 1 }
        quartier: { type: string, minLength: 1 }
        localite: { type: ["string", "null"], maxLength: 120 }
        avenue: { type: string, minLength: 1 }
        parcelleNo: { type: string, minLength: 1 }
        plaqueNo: { type: string }
        proprietaireNom: { type: string, minLength: 1 }
        telephone: { type: string, minLength: 1 }
        typeOccupation: { type: string }
        superficie: { type: number }
        usageParcelle: { type: string }
        plaqueExistante: { type: string }
        statutPaiement: { type: string }
        recuNo: { type: string }
        sensibilisation: { type: string }
        hygiene: { type: object, additionalProperties: true }
        dechets: { type: object, additionalProperties: true }
        facade: { type: object, additionalProperties: true }
        drainage: { type: object, additionalProperties: true }
        activites:
          type: array
          items: { type: string }
        remarques: { type: string }
        avis: { type: object, additionalProperties: true }
        agentMatricule: { type: string }
        chefRueNom: { type: string }
        chefRueAvenue: { type: string }
        dateProspection: { type: string, format: date }
    FicheUpdate:
      allOf:
        - $ref: "#/components/schemas/FicheInput"
    FicheLocaliteInput:
      type: object
      required: [localite]
      properties:
        localite: { type: ["string", "null"], maxLength: 120 }
    FicheDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [validee, rejetee] }
        motif: { type: string }
    DuplicateCheck:
      type: object
      required: [duplicate]
      properties:
        duplicate: { type: boolean }
        fiche:
          oneOf:
            - $ref: "#/components/schemas/Fiche"
            - type: "null"
    Plaque:
      type: object
      required: [id, ficheId, ficheNo, commune, quartier, avenue, plaqueNo, version, statut, svg, genereLe, verificationUrl]
      properties:
        id: { type: string, format: uuid }
        ficheId: { type: string, format: uuid }
        ficheNo: { type: string }
        commune: { type: string }
        quartier: { type: string }
        avenue: { type: string }
        plaqueNo: { type: string }
        version: { type: integer }
        statut: { type: string, enum: [generee, a_reimprimer, imprimee] }
        svg: { type: string }
        genereLe: { type: string, format: date-time }
        imprimeLe: { type: ["string", "null"], format: date-time }
        verificationUrl: { type: ["string", "null"] }
    PublicPlaque:
      type: object
      required: [ficheNo, plaqueNo, version, actuelle, commune, quartier, localite, avenue, parcelleNo, statut, genereLe]
      properties:
        ficheNo: { type: string }
        plaqueNo: { type: string }
        version: { type: integer }
        actuelle: { type: boolean }
        commune: { type: string }
        quartier: { type: string }
        localite: { type: ["string", "null"] }
        avenue: { type: string }
        parcelleNo: { type: string }
        statut: { type: string, enum: [generee, a_reimprimer, imprimee] }
        genereLe: { type: string, format: date-time }
    RubriqueSettings:
      type: object
      required: [adressage, hygiene, dechets, facade, drainage, activites, remarques, avis]
      properties:
        adressage: { type: boolean }
        hygiene: { type: boolean }
        dechets: { type: boolean }
        facade: { type: boolean }
        drainage: { type: boolean }
        activites: { type: boolean }
        remarques: { type: boolean }
        avis: { type: boolean }
    RubriqueSettingChange:
      type: object
      required: [rubrique, active]
      properties:
        rubrique:
          type: string
          enum: [adressage, hygiene, dechets, facade, drainage, activites, remarques, avis]
        active: { type: boolean }
    Dashboard:
      type: object
      required: [totalFiches, enAttente, validees, plaquesAImprimer, repartitionCommunes, activiteRecente]
      properties:
        totalFiches: { type: integer }
        enAttente: { type: integer }
        validees: { type: integer }
        plaquesAImprimer: { type: integer }
        repartitionCommunes:
          type: array
          items:
            type: object
            required: [commune, total]
            properties:
              commune: { type: string }
              total: { type: integer }
        activiteRecente:
          type: array
          items:
            type: object
            required: [id, action, ficheNo, horodatage]
            properties:
              id: { type: string }
              action: { type: string }
              ficheNo: { type: string }
              horodatage: { type: string, format: date-time }